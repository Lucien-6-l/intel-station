name: Fetch Intelligence

# ============================================================
# 防冲突加固版
# - 修复 "! [rejected] main -> main (fetch first)" 报错
# - Commit 前先拉取远端最新作为基线，再放入本次生成的数据 → 永不 non-fast-forward
# - 触发方式：定时 / 手动 / cron-job.org 外部触发
# ============================================================

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 兜底定时（每 15 分钟 4 个时点）
  workflow_dispatch:               # 手动触发按钮
  repository_dispatch:             # cron-job.org 等外部定时器触发
    types: [fetch-now]

# 必须：允许把更新后的 data.json 推回仓库
# 同时需在 Settings → Actions → General → Workflow permissions 选 Read and write
permissions:
  contents: write

concurrency:
  group: fetch-intel
  cancel-in-progress: true         # 只保留最新一次，避免堆积与相互撞车

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch RSS feeds
        run: python fetcher.py

      - name: Optional - push digest via WxPusher
        continue-on-error: true
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          if [ -n "$WXPUSHER_TOKEN" ] && [ -f push_wxpusher.py ]; then
            python push_wxpusher.py
          else
            echo "跳过推送（未配置 token 或缺少 push_wxpusher.py）"
          fi

      - name: Commit updated data (conflict-proof)
        run: |
          set -e
          git config user.name "intel-bot"
          git config user.email "bot@users.noreply.github.com"

          # 1) 把本次刚生成的数据暂存到临时文件
          cp data.json /tmp/fresh.json

          # 2) 拉取远端最新，并把工作区重置到远端最新（消除一切分叉）
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          # 3) 用本次生成的数据覆盖（确定性地以最新数据为准，永不产生合并冲突）
          cp /tmp/fresh.json data.json
          git add data.json

          # 4) 若与远端完全一致则无需提交
          if git diff --cached --quiet; then
            echo "与远端一致，无需提交"
            exit 0
          fi

          git commit -m "auto: update intelligence data $(date -u '+%Y-%m-%d %H:%M UTC')"

          # 5) 推送，带重试（防止与外部定时器极短并发）
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ 数据已更新并推送"
              exit 0
            fi
            echo "push 第 $i 次失败，拉取远端后重试…"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --soft "origin/${GITHUB_REF_NAME}" || true
          done
          echo "❌ 多次推送仍失败"
          exit 1
