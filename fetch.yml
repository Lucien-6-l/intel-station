name: Fetch Intelligence

# ⚠️ 重要：GitHub 自带的定时任务不保证准点，高峰期可能延迟 15 分钟以上，
# 仓库 60 天无活动还会被自动暂停。要"准实时"，请配合下方 README 的外部定时器方案。

on:
  schedule:
    # 每小时 4 次（GitHub 定时最小 5 分钟，但免费版实际经常延迟；多个时点可降低整轮被吞的概率）
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:        # 手动触发按钮
  repository_dispatch:      # 供外部定时器（如 cron-job.org）调用，实现准实时
    types: [fetch-now]

# 允许把更新后的 data.json 推回仓库（必须）
permissions:
  contents: write

concurrency:
  group: fetch-intel
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch RSS feeds
        run: python fetcher.py

      - name: Optional - push digest via WxPusher
        env:
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          if [ -n "$WXPUSHER_TOKEN" ]; then python push_wxpusher.py; else echo "未配置 WXPUSHER_TOKEN，跳过推送"; fi

      - name: Commit updated data
        run: |
          git config user.name "intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "auto: update intelligence data $(date -u +%m-%d\ %H:%M)"
            git push
          fi
