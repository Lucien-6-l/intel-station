<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情报站 · 通用版</title>
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --bg:#f2f4f8;--surface:#fff;--fg:#0f1424;--muted:#6b7280;--border:#e6e9f0;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.1);--danger:#e0374a;--hot:#ff4d4f;
  --ch:#0f1424;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#dfe3ec;color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.device{width:390px;height:844px;max-width:100vw;max-height:calc(100vh - 40px);background:#111;border-radius:54px;padding:11px;box-shadow:0 30px 70px -20px rgba(15,20,36,.55),0 0 0 2px #000 inset;position:relative}
.device::after{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:999px;z-index:60}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 0;font-size:14px;font-weight:700}
.statusbar .r{display:flex;gap:5px;align-items:center}
.statusbar svg{width:16px;height:11px;fill:var(--fg)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.screenview{display:none;height:100%}
.screenview.on{display:flex;flex-direction:column}

/* tabbar */
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);padding:6px 4px 2px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:10px;background:none;border:0;font-family:inherit;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.1}
.home-ind{flex:0 0 22px;position:relative}
.home-ind::after{content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:130px;height:5px;background:var(--fg);border-radius:999px;opacity:.85}

/* ===== Onboarding ===== */
#onboard{background:linear-gradient(180deg,#fff 0%,#eef3ff 100%)}
.ob-top{padding:44px 26px 8px}
.ob-logo{width:60px;height:60px;border-radius:18px;background:var(--accent);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 10px 24px -8px rgba(37,99,235,.7)}
.ob-logo svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2}
.ob-top h2{font-size:26px;margin:0 0 8px;letter-spacing:-.02em;line-height:1.2}
.ob-top p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.ob-mid{flex:1;overflow-y:auto;padding:14px 26px 8px}
.ob-group{margin-bottom:20px}
.ob-group h3{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:9px 15px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--fg);font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;user-select:none}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ob-bottom{padding:12px 26px 26px;background:linear-gradient(180deg,transparent,#eef3ff 30%)}
.btn{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--accent);color:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer;display:grid;place-items:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--fg);border:1px solid var(--border)}
.ob-count{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px}

/* ===== Home ===== */
.topbar{padding:6px 16px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.searchbar{display:flex;align-items:center;gap:8px;background:#f0f2f7;border-radius:12px;padding:11px 13px;color:var(--muted)}
.searchbar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 auto}
.searchbar input{border:0;outline:none;background:none;font:14px inherit;font-family:inherit;color:var(--fg);width:100%}
.tabs-row{display:flex;gap:6px;overflow-x:auto;padding:11px 16px 10px;scrollbar-width:none;background:rgba(255,255,255,.92)}
.tabs-row::-webkit-scrollbar{display:none}
.ctab{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.ctab.on{background:var(--accent);color:#fff}
.feed{padding:2px 16px 30px}
.hot{display:flex;gap:10px;align-items:center;background:linear-gradient(120deg,#fff5f5,#fff 70%);border:1px solid #ffe0e0;border-radius:16px;padding:13px 15px;margin-bottom:12px;cursor:pointer}
.hot .flame{font-size:20px}
.hot .txt .lbl{font:700 11px inherit;color:var(--hot);letter-spacing:.06em}
.hot .txt .t{font-size:14px;font-weight:600;margin-top:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:16px;padding:14px 15px;margin-bottom:10px;border:1px solid var(--border)}
.card:active{background:#f7f9ff}
.card .meta{font:600 11px inherit;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .tt{font-size:15.5px;font-weight:600;line-height:1.42;margin-top:6px}
.card .sm{font-size:13px;color:var(--muted);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.tg{padding:2px 9px;border-radius:999px;font-size:11px;background:rgba(15,20,36,.06);color:var(--muted)}
.tg.ch{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tg.urg{background:rgba(224,55,74,.1);color:var(--danger);font-weight:700}
.dot-live{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block}
.bigcard{background:#fff;border-radius:18px;border:1px solid var(--border);padding:0;overflow:hidden;margin-bottom:12px;display:block;text-decoration:none;color:inherit}
.bigcard .thumb{height:132px;background:linear-gradient(135deg,#dbe6ff,#eef3ff);display:grid;place-items:center}
.bigcard .thumb span{font:800 34px inherit;color:#b9cbff}
.bigcard .bd{padding:13px 15px 15px}
.bigcard .tt{font-size:16px;font-weight:700;line-height:1.42;margin-top:4px}

/* ===== Search ===== */
.sbar2{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;background:rgba(255,255,255,.92)}
.sbar2 .inp{flex:1;display:flex;align-items:center;gap:8px;background:#f0f2f7;border-radius:12px;padding:10px 13px}
.sbar2 .inp svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8}
.sbar2 .inp input{border:0;outline:none;background:none;font:14px inherit;font-family:inherit;color:var(--fg);width:100%}
.sbar2 .cancel{color:var(--accent);font-weight:600;font-size:14px;background:none;border:0;font-family:inherit;cursor:pointer;flex:0 0 auto}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sec-h h3{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.sec-h .clr{font-size:12px;color:var(--muted);background:none;border:0;font-family:inherit;cursor:pointer}
.hotwords{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.hw{padding:7px 13px;background:#fff;border:1px solid var(--border);border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--fg)}
.hw .n{color:var(--hot);font-weight:700;margin-right:3px}
.hist{padding:0 16px}
.hist .hrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer}
.hist .hrow span:last-child{color:var(--muted);font-size:16px}
.res-item{display:block;text-decoration:none;color:inherit;padding:13px 16px;border-bottom:1px solid var(--border);background:#fff}
.res-item .rt{font-size:15px;font-weight:600;line-height:1.4;color:#1a3ea8}
.res-item .rs{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-item .ru{font-size:11px;color:#22a06b;margin-top:4px;font-family:ui-monospace,monospace}
.src-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;margin-right:6px;vertical-align:1px}
.loading{text-align:center;padding:26px;color:var(--muted);font-size:13px}
.spin2{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 10px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty2{text-align:center;padding:50px 24px;color:var(--muted);font-size:14px}
.empty2 svg{width:46px;height:46px;stroke:var(--border);fill:none;stroke-width:1.4;margin-bottom:12px}
.note{font-size:11px;color:var(--muted);text-align:center;padding:10px 20px 26px;line-height:1.6}

/* ===== Topics ===== */
.page-h{padding:14px 20px 10px}
.page-h .g{font:700 11px ui-monospace,monospace;color:var(--muted);letter-spacing:.08em;margin:0 0 4px}
.page-h h1{font-size:24px;margin:0;letter-spacing:-.02em}
.topic{padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topic .l{display:flex;align-items:center;gap:12px;min-width:0}
.topic .av{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 13px inherit;flex:0 0 auto}
.topic .nm{font-size:15px;font-weight:600}
.topic .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sw{width:46px;height:27px;border-radius:999px;background:var(--border);border:0;position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(19px)}
.addbox{margin:6px 16px 28px}
.addbox .row{display:flex;gap:8px;margin-top:8px}
.addbox input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font:14px inherit;font-family:inherit;outline:none}
.addbox input:focus{border-color:var(--accent)}

/* ===== Me ===== */
.me-h{padding:26px 20px 18px;display:flex;align-items:center;gap:14px}
.me-h .av{width:58px;height:58px;border-radius:20px;background:var(--accent);display:grid;place-items:center;color:#fff;font:800 22px inherit}
.me-h h2{margin:0;font-size:19px}
.me-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.cell{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:#fff;border-bottom:1px solid var(--border);font-size:14.5px}
.cell .v{color:var(--muted);font-size:13px}
.cellgroup{margin:12px 0}
.reset{margin:16px 20px 30px;padding:13px;width:calc(100% - 40px);border-radius:13px;border:1px solid var(--border);background:#fff;color:var(--danger);font:600 14px inherit;font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="device">
 <div class="screen">

  <div class="statusbar">
   <span>9:41</span>
   <span class="r">
     <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4" y="5" width="3" height="6" rx=".6"/><rect x="8" y="3" width="3" height="8" rx=".6"/><rect x="12" y="0" width="3" height="11" rx=".6"/></svg>
     <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6s4.7.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6 5 9.1c1-.9 2.2-1.4 3.5-1.4s2.5.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2s-3.6.7-5 2zM6.5 10.6h4l-2-2z"/></svg>
     <svg viewBox="0 0 25 11" style="width:24px"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
   </span>
  </div>

  <!-- ===== ONBOARDING ===== -->
  <section class="screenview on" id="onboard">
    <div class="ob-top">
      <div class="ob-logo"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></div>
      <h2>选择你感兴趣的内容</h2>
      <p>挑几个频道，我们只为你挑选这些领域的最新情报。以后随时可以修改。</p>
    </div>
    <div class="ob-mid" id="obGroups"></div>
    <div class="ob-bottom">
      <div class="ob-count" id="obCount">已选 0 个频道</div>
      <button class="btn" id="obStart" disabled>进入情报站</button>
    </div>
  </section>

  <!-- ===== MAIN APP ===== -->
  <section class="screenview" id="main">
    <!-- HOME -->
    <div class="screenview on" id="view-home" style="height:100%">
      <div class="topbar">
        <div class="searchbar" id="homeSearch">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input placeholder="搜索全网信息…" readonly>
        </div>
      </div>
      <div class="tabs-row" id="chanTabs"></div>
      <div class="body">
        <div class="feed" id="feed"></div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="screenview" id="view-search" style="height:100%">
      <div class="sbar2">
        <div class="inp">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="sInput" placeholder="搜索关键词（全网）" autocomplete="off">
        </div>
        <button class="cancel" id="sGo">搜索</button>
      </div>
      <div class="body" id="sBody">
        <div class="sec-h"><h3>🔥 热门搜索</h3></div>
        <div class="hotwords" id="hotWords"></div>
        <div class="sec-h" id="histHead"><h3>最近搜索</h3><button class="clr" id="clrHist">清空</button></div>
        <div class="hist" id="histBox"></div>
      </div>
    </div>

    <!-- TOPICS -->
    <div class="screenview" id="view-topics" style="height:100%">
      <div class="body">
        <div class="page-h"><p class="g">按兴趣订阅 · 随时可改</p><h1>我的频道</h1></div>
        <div style="padding:0 16px 6px;">
          <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">打开开关即订阅该频道的实时情报</div>
          <div id="topicList"></div>
        </div>
        <div class="addbox">
          <div style="font-size:13px;font-weight:600;">添加自定义信息源</div>
          <div class="row">
            <input id="rssInput" placeholder="粘贴 RSS 地址，如 https://…/feed">
            <button class="btn" style="width:auto;padding:0 18px;min-height:44px;" id="addRss">添加</button>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:8px;">支持任意标准 RSS / Atom 源；添加后会出现在你的频道列表</div>
        </div>
      </div>
    </div>

    <!-- ME -->
    <div class="screenview" id="view-me" style="height:100%">
      <div class="body">
        <div class="me-h">
          <div class="av">情</div>
          <div><h2>情报站</h2><p id="meUpdated">数据加载中…</p></div>
        </div>
        <div class="cellgroup">
          <div class="cell"><span>已订阅频道</span><span class="v" id="meChans">-</span></div>
          <div class="cell"><span>情报总量</span><span class="v" id="meTotal">-</span></div>
          <div class="cell"><span>自动更新</span><span class="v"><span class="dot-live"></span> 云端运行中</span></div>
        </div>
        <div class="cellgroup">
          <div class="cell"><span>每日推送日报</span><span class="v">08:00</span></div>
          <div class="cell"><span>推送通道</span><span class="v">微信 / 浏览器</span></div>
          <div class="cell"><span>版本</span><span class="v">v2.0 通用版</span></div>
        </div>
        <button class="reset" id="resetBtn">重新选择兴趣频道</button>
      </div>
    </div>

    <nav class="tabbar" id="tabbar">
      <button class="tab on" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</button>
      <button class="tab" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索</button>
      <button class="tab" data-v="topics"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>订阅</button>
      <button class="tab" data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</button>
    </nav>
  </section>

  <div class="home-ind" id="homeInd"></div>
 </div>

/* ---------- onboarding ---------- */
var obSel = {};
function renderOb(){
  var box=$('#obGroups'); box.innerHTML='';
  CHANNELS.forEach(function(ch){
    var g=document.createElement('div'); g.className='ob-group';
    g.innerHTML='<h3>'+ch+'</h3>';
    var wrap=document.createElement('div'); wrap.className='chips';
    var sources=DATA.filter(function(i){return i.channel===ch;});
    var names=[]; sources.forEach(function(s){ if(names.indexOf(s.source)<0) names.push(s.source); });
    if(!names.length) names=[ch+' 精选'];
    names.slice(0,4).forEach(function(n){
      var b=document.createElement('button'); b.className='chip'; b.textContent=n;
      b.dataset.ch=ch; b.dataset.src=n;
      b.onclick=function(){ toggleChip(b); };
      wrap.appendChild(b);
    });
    g.appendChild(wrap); box.appendChild(g);
  });
}
function toggleChip(b){
  var ch=b.dataset.ch;
  b.classList.toggle('sel');
  obSel[ch]=obSel[ch]||{sources:[]};
  var i=obSel[ch].sources.indexOf(b.dataset.src);
  if(b.classList.contains('sel')){ if(i<0) obSel[ch].sources.push(b.dataset.src); }
  else { if(i>=0) obSel[ch].sources.splice(i,1); if(!obSel[ch].sources.length) delete obSel[ch]; }
  var n=Object.keys(obSel).length;
  $('#obCount').textContent='已选 '+n+' 个频道';
  $('#obStart').disabled = n===0;
}
$('#obStart').onclick=function(){
  cfg.subs=Object.keys(obSel);
  cfg.custom=cfg.custom||{};
  Object.keys(obSel).forEach(function(ch){ cfg.custom[ch]=obSel[ch].sources; });
  cfg.onboarded=true; save();
  startApp();
};

}
function rel(ts,fetched){
  if(ts){ var d=Math.floor(Date.now()/1000)-ts; if(d>=0){ if(d<60)return '刚刚'; if(d<3600)return Math.floor(d/60)+'分钟前'; if(d<86400)return Math.floor(d/3600)+'小时前'; if(d<604800)return Math.floor(d/86400)+'天前'; } }
  return fetched?('抓取 '+fetched):'';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ---------- topics ---------- */
function buildTopics(){
  var box=$('#topicList'); box.innerHTML='';
  CHANNELS.forEach(function(ch){
    var cnt=DATA.filter(function(i){return i.channel===ch;}).length;
    var on = cfg.subs.indexOf(ch)>=0;
    var row=document.createElement('div'); row.className='topic';
    row.innerHTML='<div class="l"><div class="av">'+(CH_ICON[ch]||ch.slice(0,1))+'</div><div><div class="nm">'+ch+'</div><div class="sub">'+cnt+' 条情报</div></div></div>';
    var sw=document.createElement('button'); sw.className='sw'+(on?' on':'');
    sw.onclick=function(){
      sw.classList.toggle('on');
      var i=cfg.subs.indexOf(ch);
      if(sw.classList.contains('on')){ if(i<0) cfg.subs.push(ch); }
      else { if(i>=0) cfg.subs.splice(i,1); }
      save(); buildHome(); buildTopics();
    };
    row.appendChild(sw); box.appendChild(row);
  });
  $('#meChans').textContent=cfg.subs.length+' 个';
  $('#meTotal').textContent=META.total+' 条';
  $('#meUpdated').textContent=META.updated_at+' 更新';
}
$('#addRss').onclick=function(){
  var v=$('#rssInput').value.trim();
  if(!v) return;
  cfg.custom=cfg.custom||{};
  var ch='自定义';
  if(!cfg.subs) cfg.subs=[];
  if(cfg.subs.indexOf(ch)<0) cfg.subs.push(ch);
  cfg.custom[ch]=cfg.custom[ch]||[]; cfg.custom[ch].push(v);
  save();
  $('#rssInput').value='';
  $('#addRss').textContent='已添加 ✓';
  setTimeout(function(){ $('#addRss').textContent='添加'; },1200);
};
$('#resetBtn').onclick=function(){
  cfg.onboarded=false; cfg.subs=[]; save(); obSel={};
  renderOb(); $('#obCount').textContent='已选 0 个频道'; $('#obStart').disabled=true;
  $('#main').classList.remove('on'); $('#onboard').classList.add('on');
};

/* ---------- search ---------- */
var HOT=['OpenAI','英伟达','新能源汽车','iPhone','世界杯','AI 绘画','量子计算','元宇宙'];
var hist=[]; try{ hist=JSON.parse(localStorage.getItem('intel_hist')||'[]'); }catch(e){}
function saveHist(){ try{ localStorage.setItem('intel_hist',JSON.stringify(hist)); }catch(e){} }
function renderSearchHome(){
  var hw=$('#hotWords'); hw.innerHTML='';
  HOT.forEach(function(w,i){
    var b=document.createElement('button'); b.className='hw';
    b.innerHTML='<span class="n" style="'+(i>2?'color:#f59e0b':'')+'">'+(i+1)+'</span>'+esc(w);
    b.onclick=function(){ $('#sInput').value=w; doSearch(w); };
    hw.appendChild(b);
  });
  var hb=$('#histBox'); hb.innerHTML='';
  if(!hist.length){ $('#histHead').style.display='none'; }
  else { $('#histHead').style.display='flex'; hist.forEach(function(h){
    var r=document.createElement('div'); r.className='hrow';
    r.innerHTML='<span>🕘 '+esc(h)+'</span><span>›</span>';
    r.onclick=function(){ $('#sInput').value=h; doSearch(h); };
    hb.appendChild(r);
  });}
}
$('#clrHist').onclick=function(){ hist=[]; saveHist(); renderSearchHome(); };
$('#sGo').onclick=function(){ doSearch($('#sInput').value.trim()); };
$('#sInput').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch($('#sInput').value.trim()); });

function doSearch(q){
  if(!q) return;
  if(hist.indexOf(q)<0){ hist.unshift(q); hist=hist.slice(0,10); saveHist(); }
  var body=$('#sBody');
  body.innerHTML='<div class="loading"><div class="spin2"></div>正在搜索全网“'+esc(q)+'”…</div>';
  var results=[]; var pending=3;
  var boxWrap=document.createElement('div');
  function done(){ if(--pending<=0) renderResults(q); }
  function add(list,tag){ list.forEach(function(x){ x._tag=tag; results.push(x); }); done(); }
  function renderResults(q){
    body.innerHTML='';
    /* 站内（已订阅情报） */
    var local=DATA.filter(function(i){ return (i.title+i.summary).toLowerCase().indexOf(q.toLowerCase())>=0; }).slice(0,6);
    if(local.length){
      var h=document.createElement('div'); h.className='sec-h'; h.innerHTML='<h3>📰 站内情报 · '+local.length+'</h3>';
      body.appendChild(h);
      local.forEach(function(it){ body.appendChild(resEl(it.title,it.summary,it.source,it.link,'站内')); });
    }
    var h2=document.createElement('div'); h2.className='sec-h'; h2.innerHTML='<h3>🌐 全网结果 · '+results.length+'</h3>';
    body.appendChild(h2);
    if(!results.length){ body.innerHTML+='<div class="empty2">没找到相关结果，换个关键词试试</div>'; }
    else results.forEach(function(r){ body.appendChild(resEl(r.title,r.snippet,r.source,r.url,r._tag)); });
    var n=document.createElement('div'); n.className='note'; n.textContent='全网搜索由 Hacker News、Wikipedia 等公开接口提供 · 结果仅供参考';
    body.appendChild(n);
  }
  /* HN Algolia */
  fetch('https://hn.algolia.com/api/v1/search?query='+encodeURIComponent(q)+'&hitsPerPage=8')
    .then(function(r){return r.json();})
    .then(function(d){ add((d.hits||[]).map(function(h){ return {title:h.title||h.story_title||'(无标题)',snippet:(h.story_text||h.comment_text||'').replace(/<[^>]+>/g,'').slice(0,140),source:'Hacker News',url:h.url||('https://news.ycombinator.com/item?id='+h.objectID)}; }),'HN'); })
    .catch(function(){ add([],'HN'); });
  /* Wikipedia zh */
  fetch('https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(q)+'&format=json&origin=*&srlimit=6')
    .then(function(r){return r.json();})
    .then(function(d){ add(((d.query&&d.query.search)||[]).map(function(s){ return {title:s.title,snippet:(s.snippet||'').replace(/<[^>]+>/g,''),source:'维基百科',url:'https://zh.wikipedia.org/wiki/'+encodeURIComponent(s.title)}; }),'Wiki'); })
    .catch(function(){ add([],'Wiki'); });
  /* DuckDuckGo Instant Answer */
  fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1')
    .then(function(r){return r.json();})
    .then(function(d){
      var arr=[];
      if(d.AbstractText&&d.AbstractURL) arr.push({title:d.Heading||q,snippet:d.AbstractText,source:'DuckDuckGo',url:d.AbstractURL});
      (d.RelatedTopics||[]).slice(0,5).forEach(function(t){
        if(t.FirstURL&&t.Text) arr.push({title:t.Text.split(' - ')[0],snippet:t.Text,source:'DuckDuckGo',url:t.FirstURL});
      });
      add(arr,'DDG');
    })
    .catch(function(){ add([],'DDG'); });
}
function resEl(title,snippet,source,url,tag){
  var a=document.createElement('a'); a.className='res-item'; a.href=url||'#'; a.target='_blank';
  var host=''; try{ host=new URL(url).hostname.replace('www.',''); }catch(e){ host=source; }
  a.innerHTML='<div class="rt"><span class="src-badge">'+esc(tag||source)+'</span>'+esc(title||'(无标题)')+'</div>'+
    (snippet?'<div class="rs">'+esc(snippet)+'</div>':'')+
    '<div class="ru">'+esc(host)+'</div>';
  return a;
}

/* ---------- boot ---------- */
function reRender(){
  if($('#main') && $('#main').classList.contains('on')){ buildHome(); buildTopics(); }
}
if(cfg.onboarded && cfg.subs && cfg.subs.length){ startApp(); }
else { renderOb(); }
renderSearchHome();

/* ---------- \u52a8\u6001\u8bfb\u53d6\u6700\u65b0\u6570\u636e\uff08\u4e91\u7aef\u90e8\u7f72\u540e\u81ea\u52a8\u751f\u6548\uff09 ---------- */
(function loadLive(){
  if(location.protocol==='file:') return;   /* \u672c\u5730\u53cc\u51fb\u6253\u5f00\u65f6\u4f7f\u7528\u5185\u7f6e\u5feb\u7167 */
  fetch('./data.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      if(d && d.items && d.items.length){
        DATA=d.items;
        META={updated_at:d.updated_at,total:d.total,channels:d.channels||META.channels};
        reRender();
        var mu=document.getElementById('meUpdated'); if(mu) mu.textContent=(d.updated_at||'')+' \u66f4\u65b0';
        var mt=document.getElementById('meTotal'); if(mt) mt.textContent=(d.total||DATA.length)+' \u6761';
      }
    })
    .catch(function(){});
})();
</script>
